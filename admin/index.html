<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarVista Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-theme="dark">

  <!-- Login View -->
  <div id="login-view" class="admin-view active">
    <div class="login-card glass-card">
      <div class="logo">
        <i data-lucide="sun" class="logo-icon text-solar"></i>
        <span>SolarVista Admin</span>
      </div>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn-primary w-100">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="admin-view">
    <aside class="sidebar">
      <div class="logo">
        <i data-lucide="sun" class="logo-icon text-solar"></i>
        <span>SolarVista</span>
      </div>
      <nav class="admin-nav">
        <button class="nav-btn active" data-target="leads">
          <i data-lucide="users"></i> Leads
        </button>
        <button class="nav-btn" data-target="blogs">
          <i data-lucide="file-text"></i> Blog CMS
        </button>
        <button class="nav-btn" data-target="products">
          <i data-lucide="box"></i> Product CMS
        </button>
      </nav>
      <button id="logout-btn" class="nav-btn logout-btn">
        <i data-lucide="log-out"></i> Sign Out
      </button>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <h1 id="page-title">Lead Management</h1>
      </header>

      <!-- Leads Section -->
      <section id="leads-section" class="content-section active">
        <div class="glass-card table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>System Type</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="leads-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Blog CMS Section -->
      <section id="blogs-section" class="content-section">
        <div class="glass-card">
          <div class="cms-header">
            <h2>Manage Articles</h2>
            <button id="new-post-btn" class="btn-primary">New Article</button>
          </div>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="blogs-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Products CMS Section -->
      <section id="products-section" class="content-section">
        <div class="glass-card">
          <div class="cms-header">
            <h2>Manage Products</h2>
            <button id="new-product-btn" class="btn-primary">New Product</button>
          </div>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>3D Model URL</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- New Article Modal -->
  <div id="article-modal" class="modal-overlay">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2>Create New Article</h2>
        <button id="close-modal-btn" class="btn-text"><i data-lucide="x"></i></button>
      </div>
      <form id="new-article-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="article-title" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="article-category" placeholder="e.g. Technology" required>
        </div>
        <div class="form-group">
          <label>Excerpt</label>
          <textarea id="article-excerpt" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Icon (Lucide name)</label>
          <input type="text" id="article-icon" placeholder="e.g. sun, battery-charging, zap" value="file-text" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Publish Article</button>
        </div>
      </form>
    </div>
  </div>

  <!-- New Product Modal -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2>Create New Product</h2>
        <button id="close-product-modal-btn" class="btn-text"><i data-lucide="x"></i></button>
      </div>
      <form id="new-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="product-name" required>
        </div>
        <div class="form-group">
          <label>Category (panel, inverter, battery)</label>
          <input type="text" id="product-category" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="product-description" rows="2" required></textarea>
        </div>
        <div class="form-group">
          <label>3D Model GLTF/GLB URL (Optional)</label>
          <input type="text" id="product-model-url" placeholder="https://.../model.glb">
        </div>
        <div class="form-group">
          <label>Specs (JSON Array)</label>
          <input type="text" id="product-specs" value='[{"value": "440W", "label": "Output"}]'>
        </div>
        <div class="form-group">
          <label>Features (JSON Array)</label>
          <input type="text" id="product-features" value='["Feature 1", "Feature 2"]'>
        </div>
        <div class="form-group">
          <label>Icon (Lucide name)</label>
          <input type="text" id="product-icon" value="box">
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-product-modal-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
